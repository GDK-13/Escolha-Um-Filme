<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Escolha Um Filme - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>🎬 Escolha Um Filme</h1>

    <div class="card">
      <h2>Entrar</h2>
      <input type="text" id="login-nome" placeholder="Seu nome">
      <input type="password" id="login-senha" placeholder="Senha">
      <button onclick="fazerLogin()">Entrar</button>
      <p id="login-erro" class="erro"></p>
    </div>

    <div class="card">
      <h2>Criar conta</h2>
      <input type="text" id="cad-nome" placeholder="Seu nome">
      <input type="password" id="cad-senha" placeholder="Crie uma senha">
      <button onclick="criarConta()">Cadastrar</button>
      <p id="cad-erro" class="erro"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
