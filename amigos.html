<!DOCTYPE html>
<html lang="pt-br">
<head>

  <title>Meus Amigos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="topo">
      <h1>Meus Amigos</h1>
      <div>
        <a href="grupos.html">← Grupos</a>
        <button onclick="logout()">Sair</button>

      <p class="erro" id="amigo-erro"></p>
    </div>

    <div id="lista-amigos">Carregando...</div>
  </div>

</html>
